[package]
name = "balcao-pdv"
version = "0.1.0"
description = "Balcão PDV: frente de caixa desktop com Tauri"
authors = ["Vitor Moura"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"
chrono = "0.4"
